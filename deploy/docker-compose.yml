# Production self-host: Postgres + App (API + web) + WhatsApp Engine dalam satu compose.
# Jalankan dari root repo:  docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# App terbuka di port 3000. Pasang reverse proxy (Caddy/Nginx/Traefik/Dokploy) + HTTPS di depannya.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctwa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: ctwa_tracker
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctwa -d ctwa_tracker"]
      interval: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ctwa:${POSTGRES_PASSWORD}@db:5432/ctwa_tracker
      APP_URL: ${APP_URL:?isi APP_URL di .env, mis. https://ctwa.domainanda.com}
      BETTER_AUTH_URL: ${APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?isi BETTER_AUTH_SECRET di .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?isi ENCRYPTION_KEY di .env}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      ENGINE_URL: http://engine:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?isi INTERNAL_TOKEN di .env}
    ports: ["${APP_PORT:-3000}:3000"]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 256m

  engine:
    build:
      context: ../engine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ctwa:${POSTGRES_PASSWORD}@db:5432/ctwa_tracker
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      GOMEMLIMIT: ${ENGINE_GOMEMLIMIT:-200MiB}
      DB_POOL_SIZE: ${ENGINE_DB_POOL_SIZE:-4}
    # tidak ada port publik: hanya diakses `app` lewat jaringan internal
    depends_on:
      db: { condition: service_healthy }
    stop_grace_period: 20s
    mem_limit: 256m

volumes:
  pgdata:
