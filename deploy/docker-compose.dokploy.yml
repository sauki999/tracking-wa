# Compose untuk Dokploy. Domain + HTTPS diatur Dokploy (Traefik) ke service `app` port 3000.
# Variabel diisi lewat Environment di Dokploy:
#   POSTGRES_PASSWORD, APP_URL, BETTER_AUTH_SECRET, ENCRYPTION_KEY, INTERNAL_TOKEN
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctwa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ctwa_tracker
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctwa -d ctwa_tracker"]
      interval: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ctwa:${POSTGRES_PASSWORD}@db:5432/ctwa_tracker
      APP_URL: ${APP_URL}
      BETTER_AUTH_URL: ${APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      ENGINE_URL: http://engine:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    expose: ["3000"]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 256m
    networks: [default, dokploy-network]

  engine:
    build:
      context: ../engine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ctwa:${POSTGRES_PASSWORD}@db:5432/ctwa_tracker
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      GOMEMLIMIT: ${ENGINE_GOMEMLIMIT:-200MiB}
      DB_POOL_SIZE: ${ENGINE_DB_POOL_SIZE:-4}
    depends_on:
      db: { condition: service_healthy }
    stop_grace_period: 20s
    mem_limit: 256m

volumes:
  pgdata:

networks:
  dokploy-network:
    external: true
